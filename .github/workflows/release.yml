name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # OIDC token for Sigstore keyless signing
      attestations: write  # store build provenance attestations
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false     # don't let a poisoned cache into release builds

      - name: Test
        run: make test

      - name: Build release binaries
        run: make dist VERSION="${GITHUB_REF_NAME}"

      - name: Checksums
        working-directory: dist
        run: sha256sum stagecoach-scan-* > checksums.txt

      # Signs a SLSA build-provenance attestation for every binary.
      # Users verify with: gh attestation verify <file> --repo jtarleton/stagecoach-scan
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/stagecoach-scan-*'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
